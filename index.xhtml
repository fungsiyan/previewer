<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
    <head>
        <title>Image Previewer</title>
        <meta http-equiv="content-type"     content="text/html;charset=UTF-8"/>
        <meta http-equiv="content-language" content="en"/>
        <meta name="viewport"     content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
        <meta name="color-scheme" content="light dark"/>
        <base target="_blank"  rel="noopener noreferrer"/>
        <link rel="icon"       type="image/x-icon" href="https://www.graalonline.com/favicon.ico"/>
        <link rel="stylesheet" type="text/css"     href="style.css"/>
    </head>
    <body>
        <header>
        </header>
        <section>
            <article>
                <input type="file" id="upload" name="upload" accept=".gif,.png,.gani"/>
                <br/>
                <canvas id="canvas" width="370" height="370"></canvas>
                <br/>
                <select name="animations" id="animations" onchange='onAnimationChanged(this)'>
                </select>
                Direction:
                <select name="directions" id="directions" onchange='onDirectionChanged(this)'>
                    <option value="0">Up   </option>
                    <option value="1">Left </option>
                    <option value="2">Down </option>
                    <option value="3">Right</option>
                </select>
                Zoom:
                <select name="zoom" id="zoom" onchange='onZoomChange(this)'>
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                    <option value="4">4x</option>
                </select>
            </article>
            <nav>
                <br/>
                <div data-toggle="buttons">
                    <label for="vis_head">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_head0.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_head"      value="HEAD"  />Head
                    </label><br/>
                    <label for="vis_body">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_body0.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_body"      value="BODY"  />Body
                    </label><br/>
                    <label for="vis_hat">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_hat0.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_hat"       value="ATTR1" />Hat
                    </label><br/>
                    <label for="vis_accessory">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_accessory2.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_accessory" value="ATTR4" />Accessory
                    </label><br/>
                    <label for="vis_shield">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_shield0.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_shield"    value="SHIELD"/>Shield
                    </label><br/>
                    <label for="vis_sword">
                        <img src="https://classiccachecloud.quattroplay.com/images4/dcicon_menu_sword0.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_sword"     value="SWORD" />Sword
                    </label><br/>
                    <label for="vis_horse">
                        <img src="https://classiccachecloud.quattroplay.com/icons/dcicon_ride.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_horse"     value="HORSE" />Horse
                    </label><br/>
                    <label for="vis_param">
                        <img src="https://classiccachecloud.quattroplay.com/images2/classic_icon_bow.png"/>
                        <input type="checkbox" checked="" onchange='onToggleVisibility(this)' id="vis_param"     value="PARAM1"/>Param
                    </label>
                </div>
            </nav>
        </section>
        <script type="text/javascript" src="main.js?random=203"></script>
        <script type="text/javascript" src="defaultGanis.js?random=203"></script>
        <footer><br/><center>Original code by <a href="https://github.com/dustyshouri/GraalImagePreviewer">Dusty</a>.</center></footer>
    </body>
</html>
